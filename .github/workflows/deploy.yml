name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'PUBLISH.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build_site.py が _site/ を組み立てる。
      #   index.html + assets/ + data/events.json をコピーし、
      #   JSON-LD の差し込みと sitemap.xml / robots.txt の生成を行う。
      # リポジトリ内のファイルは書き換えないので、生成物のコミットは不要。
      # SITE_URL は Pages の公開URLが自動で入る。
      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
